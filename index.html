  <meta name="color-scheme" content="light dark" />

  <script>
    (() => {
      const lightThemeColor = '#f7f7f7';
      const darkThemeColor = '#201f1f';
      const savedTheme = localStorage.getItem('cad-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const useDarkTheme = savedTheme === 'dark' || ((savedTheme === null || savedTheme === 'system') && prefersDark);
      const themeColorMeta = document.querySelector('meta[name="theme-color"]');

      if (themeColorMeta) {
        themeColorMeta.setAttribute('content', useDarkTheme ? darkThemeColor : lightThemeColor);
      }
    })();
  </script>
