<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NcStudio CAD</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json" crossorigin="use-credentials" />
  <meta name="application-name" content="NcStudio CAD/CAM" />
  <meta name="apple-mobile-web-app-title" content="NcStudio CAD/CAM" />
  <meta name="theme-color" content="#f7f7f7" />
  <meta name="msapplication-TileColor" content="#0078d4" />
  <meta name="color-scheme" content="light dark" />

  <script>
    (() => {
      const lightThemeColor = '#f7f7f7';
      const darkThemeColor = '#201f1f';
      const savedTheme = localStorage.getItem('cad-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const useDarkTheme = savedTheme === 'dark' || ((savedTheme === null || savedTheme === 'system') && prefersDark);
      const themeColorMeta = document.querySelector('meta[name="theme-color"]');

      if (themeColorMeta) {
        themeColorMeta.setAttribute('content', useDarkTheme ? darkThemeColor : lightThemeColor);
      }
    })();
  </script>

  <!-- Favicon -->
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />

  <style>
    /* Body padding will be handled by React component */
    body {
      margin: 0;
      padding: 0;
    }

    #global-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: var(--color-background, #f7f7f7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      #global-loader {
        background: var(--color-background, #201f1f);
      }
    }

    .loader-logo {
      margin-bottom: 24px;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    .loader-spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(0, 120, 212, 0.2);
      border-top-color: #0078d4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
    }

    .loader-progress-track {
      width: 300px;
      height: 4px;
      background: rgba(0, 120, 212, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    #loader-progress-fill {
      height: 100%;
      width: 0%;
      background: #0078d4;
      border-radius: 2px;
      transition: width 0.2s ease-out;
    }

    #loader-status-text {
      color: var(--color-text-secondary, #605e5c);
      font-size: 13px;
      font-weight: 500;
      min-height: 20px;
      text-align: center;
      width: 300px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (prefers-color-scheme: dark) {
      #loader-status-text {
        color: var(--color-text-secondary, #a19f9d);
      }
      .loader-spinner {
        border-color: rgba(0, 120, 212, 0.3);
      }
      .loader-progress-track {
        background: rgba(255, 255, 255, 0.1);
      }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
  </style>
